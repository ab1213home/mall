<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>使用StompJs的简单聊天应用</title>
  <link type="text/css" rel="stylesheet" href="../../assets/style.css">
</head>
<body>
<div id="wrapper">
  <ul>
    <li>打开多个浏览器或标签页进行聊天。</li>
    <li>您需要运行一个STOMP代理。默认设置适用于本地机器上的全新RabbitMQ。</li>
    <li>根据您的STOMP代理调整<a href="https://stomp-js.github.io/api-docs/latest/classes/StompConfig.html">配置</a>。</li>
    <li>使用指南：<a href="https://stomp-js.github.io/guide/stompjs/2018/06/28/using-stompjs-v5.html">使用StompJs v5</a></li>
    <li>API调用的详细信息请参见：<a href="https://stomp-js.github.io/api-docs/latest/classes/Client.html">API参考</a></li>
    <li>HTML/CSS主要基于<a href="https://code.tutsplus.com/tutorials/how-to-create-a-simple-web-based-chat-application--net-5931">简单的基于Web的聊天应用</a></li>
  </ul>
  <div id="menu">
    <p class="welcome">欢迎, <input title="用户名" name="username" id="username" type="text" value="更改我"></p>
  </div>

  <div id="chatbox"></div>

  <input name="usermsg" type="text" id="usermsg" size="63" title="用户消息"/>
  <button name="submitmsg" id="submitmsg">发送</button>
</div>

<!-- 用于DOM操作，使用stompjs不是必须的 -->
<script src="https://cdn.jsdelivr.net/npm/jquery@3.3.1/dist/jquery.min.js"></script>

<!-- 从CDN引入以提高性能，或者您也可以本地复制 -->
<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0-beta2/bundles/stomp.umd.min.js"></script>

<script type="application/javascript">
  $(function () {
    let stompClient;

    const stompConfig = {
      // 通常包括登录名、密码和虚拟主机
      // 根据您的代理进行调整
      connectHeaders: {
        login: "guest",
        passcode: "guest"
      },

      // 代理URL，应以ws://或wss://开头 - 根据您的代理设置进行调整
      brokerURL: "ws://localhost:15674/ws",

      // 生产环境中请关闭，它可能会非常冗长
      // 如果要禁用，请跳过此键
      debug: function (str) {
        console.log('STOMP: ' + str);
      },

      // 如果断开连接，它将在200毫秒后重试
      reconnectDelay: 200,

      // 订阅应在onConnect内部完成，因为当代理重新连接时需要重新订阅
      onConnect: function (frame) {
        // 返回的对象有一个名为`unsubscribe`的方法
        const subscription = stompClient.subscribe('/topic/chat', function (message) {
          const payload = JSON.parse(message.body);
          displayIncomingMessage(payload.user, payload.usrMsg);
        });
      }
    };

    // 创建一个实例
    stompClient = new StompJs.Client(stompConfig);

    // 您可以在此处设置其他配置选项

    // 尝试连接
    stompClient.activate();

    // 为了演示，为聊天设置一个随机的显示用户名，感觉会更好
    $("#username").val("用户 " + Math.round(Math.random() * 100));

    // 设置DOM事件处理程序，不能放在onConnect内 - 否则每次重新连接时都会重复添加
    $("#submitmsg").click(function () {
      if (publishMessage($("#username").val(), $("#usermsg").val())) {
        clearMessageInput();
      }
    });

    function clearMessageInput() {
      $("#usermsg").val("");
    }

    function publishMessage(user, message) {
      // 当代理未连接时尝试发布消息将抛出异常
      if (!stompClient.connected) {
        alert("代理已断开连接，无法发送消息。");
        return false;
      }
      if (message.length > 0) {
        const payLoad = {user: user, usrMsg: message};

        // 您还可以另外传递头部信息
        stompClient.publish({destination: '/topic/chat', body: JSON.stringify(payLoad)});
      }
      return true;
    }

    function displayIncomingMessage(user, message) {
      const msgDiv = $("<div>").addClass("msgln");
      msgDiv.html('<span class="user">[' + user + ']: </span><span class="message">' + message + '</span>');
      $("#chatbox").append(msgDiv);
    }
  })
</script>
</body>
</html>
