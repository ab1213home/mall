<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>站内信客户端</title>
    <!-- 引入 SockJS 和 STOMP -->
    <script src="/public/sockjs-client-1.6.1/sockjs.min.js"></script>
    <script src="/public/stompjs-7.0.0-beta2/bundles/stomp.umd.js"></script>
<!--&lt;!&ndash;    <script src="/public/stompjs-6.1.2/esm6/"></script>&ndash;&gt;-->
</head>
<body>
    <div style="padding: 20px; max-width: 600px; margin: 0 auto;">
        <!-- 连接控制 -->
        <div style="margin-bottom: 20px;">
            <input type="text" id="userId" placeholder="输入用户ID" value="123" style="padding: 5px;">
            <button onclick="connect()" id="connectBtn">连接</button>
            <button onclick="disconnect()" id="disconnectBtn" disabled>断开</button>
        </div>

        <!-- 消息发送区 -->
        <div style="margin-bottom: 20px;">
            <input type="text" id="messageInput" placeholder="输入消息内容" style="width: 300px; padding: 5px;">
            <button onclick="sendMessage()">发送消息</button>
        </div>

        <!-- 状态显示 -->
        <div id="status" style="color: #666; margin-bottom: 10px;">状态：未连接</div>

        <!-- 消息展示区 -->
        <div style="border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto;">
            <div id="messages"></div>
        </div>
    </div>
<!-- It is used for DOM manipulation, not mandatory to use stompjs -->
<script src="/public/jquery-3.7.1-dist/jquery-3.7.1.min.js"></script>

<!-- Include from CDN for better performance, alternatively you can locally copy as well -->
<!--<script src="https://cdn.jsdelivr.net/npm/@stomp/stompjs@7.0.0-beta2/bundles/stomp.umd.min.js"></script>-->
<!--<script type="application/javascript">-->
<script>
    let stompClient = null;
    let currentUserId = null;

    // 连接WebSocket
    function connect() {
        currentUserId = document.getElementById('userId').value;
        stompClient = new StompJs.Client({
        webSocketFactory: () => new SockJS('http://localhost:8080/ws'),
        connectHeaders: {
            login: 'guest',
            passcode: 'guest'
        },
        debug: function (str) {
            console.log('STOMP: ' + str);
        },
        reconnectDelay: 200,
        onConnect: (frame) => {
            updateStatus('已连接', '#4CAF50');

            // 订阅个人消息频道
            stompClient.subscribe(`/topic/chat`, (message) => {
                showMessage('收到消息', JSON.parse(message.body));
            });

            // 启用控件
            document.getElementById('connectBtn').disabled = true;
            document.getElementById('disconnectBtn').disabled = false;
            document.getElementById('userId').disabled = true;
        },
        onStompError: (frame) => {
            updateStatus('连接失败: ' + frame.headers['message'], '#f44336');
        }
    });

    stompClient.activate();
    }

    // 断开连接(错误)
    function disconnect() {
        if (stompClient !== null) {
            stompClient.disconnect(() => {
                updateStatus('已断开', '#666');
                document.getElementById('connectBtn').disabled = false;
                document.getElementById('disconnectBtn').disabled = true;
                document.getElementById('userId').disabled = false;
            });
        }
    }

    // 发送消息
    function sendMessage() {
        const content = document.getElementById('messageInput').value;
        if (!stompClient.connected) {
            alert("代理已断开连接，无法发送消息。");
            return;
        }
        const payLoad = {
            userId: currentUserId,
            content: content
        };
        if (content.length > 0) {
            // 您还可以另外传递头部信息
            stompClient.publish({destination: '/topic/chat', body: JSON.stringify(payLoad)});
        }

        // 清空输入框
        document.getElementById('messageInput').value = '';
    }


    // 显示消息
    function showMessage(type, data) {
        const messagesDiv = document.getElementById('messages');
        const timestamp = new Date().toLocaleTimeString();

        messagesDiv.innerHTML += `
            <div style="margin: 5px 0; padding: 5px; background: #f5f5f5;">
                <strong>[${timestamp}] ${type}:</strong>
                ${data.content}
            </div>
        `;

        // 自动滚动到底部
        messagesDiv.scrollTop = messagesDiv.scrollHeight;
    }

    // 更新状态显示
    function updateStatus(text, color) {
        const statusDiv = document.getElementById('status');
        statusDiv.innerHTML = `状态：${text}`;
        statusDiv.style.color = color;
    }
</script>
</body>
</html>
