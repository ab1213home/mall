spring.application.name=mall
# 数据库连接信息
spring.datasource.name=mall-datasource
spring.datasource.username= mall
spring.datasource.password= mall
spring.datasource.url= jdbc:mysql://mysql:3306/mall?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.auto-commit=true
spring.datasource.hikari.idle-timeout=10000
spring.datasource.hikari.pool-name=hikariCP
spring.datasource.hikari.max-lifetime=30000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
# Redis连接配置
spring.data.redis.host=redis
spring.data.redis.port=6379
spring.data.redis.password=mall
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.max-idle= 8
spring.data.redis.lettuce.pool.min-idle= 0
spring.data.redis.lettuce.pool.max-wait= 5s
logging.level.org.springframework.data.redis=DEBUG
logging.level.org.springframework.boot.autoconfigure.data.redis=DEBUG
# mybatis-plus
mybatis-plus.configuration.log-impl= org.apache.ibatis.logging.stdout.StdOutImpl
#mybatis-plus.configuration.log-impl= org.apache.ibatis.logging.slf4j.Slf4jImpl
mybatis-plus.global-config.db-config.logic-delete-field= isDel
mybatis-plus.global-config.db-config.logic-delete-value= 1
mybatis-plus.global-config.db-config.logic-not-delete-value= 0
mybatis-plus.global-config.db-config.id-type= auto
#mybatis-plus.mapper-locations=classpath:mapper/*.xml
# 邮件配置
spring.mail.default-encoding=utf-8
# 文件上传配置
spring.servlet.multipart.enabled= true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
# 国际化配置
spring.messages.basename = classpath:i18n/messages
spring.messages.encoding = UTF-8
spring.messages.fallback-to-system-locale = false

#配置文件位置
mall.config.location=/home/
#配置文件保存方式，单文件（single）还是多文件（files），默认单文件single
mall.config.mode=single

# flyway配置
spring.flyway.locations= classpath:db
spring.flyway.baseline-on-migrate= true
spring.flyway.table= tb_flyway
spring.flyway.enabled= true
# flyway 的 clean 命令会删除指定 schema 下的所有 table, 生产务必禁掉。这个默认值是 false 理论上作为默认配置是不科学的。
spring.flyway.clean-disabled = true
spring.flyway.baseline-version = 1