services:
  mall-core:
    image: registry.cn-hangzhou.aliyuncs.com/jianrongjun/mall:latest
    container_name: mall-core
    restart: always
    networks:
      - mall
    ports:
      - "8080:8080"
    depends_on:
      - mall-redis
      - mall-mysql
      - mall-elasticsearch
    volumes:
      - ./data:/home
      - ./application.properties:/application.properties
  mall-redis:
    image: redis:6.2.16
    restart: always
    container_name: mall-redis
    networks:
      - mall
    volumes:
      - ./redis:/data
      - ./redis_6.2.conf:/usr/local/etc/redis/redis.conf
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
  mall-mysql:
    image: mysql:8.0.36
    container_name: mall-mysql
    restart: always
    networks:
      - mall
    volumes:
      - ./mysql/conf:/etc/mysql
      - ./mysql/data:/var/lib/mysql
      - ./mysql/log:/var/log/mysql
      - ./data/init.sql:/docker-entrypoint-initdb.d/init.sql
    environment:
      MYSQL_ROOT_PASSWORD: mall
  mall-elasticsearch:
    image: elasticsearch:8.15.0
    container_name: mall-elasticsearch
    restart: always
    networks:
      - mall
    volumes:
      - ./elasticsearch/data:/usr/share/elasticsearch/data
      - ./elasticsearch/backup:/usr/share/elasticsearch/backup
      - ./elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    environment:
      - discovery.type=single-node
      - ELASTIC_PASSWORD=S4ktFcSNnTEhzYsW
      - xpack.security.enabled=true
      - ES_JAVA_OPTS=-Xlog:disable -Xlog:gc=debug:stderr -Xms512m -Xmx512m
networks:
  mall:
    external: false